key: assisted
version: 1.0.0
tier: core
auth: none
surfaces:
  - type: assisted
    content_types: [text, image, video, link]
    spec: {title_max_chars: 255, body_max_chars: 32000, links_allowed: true}
rate_limits: {per_connection: {requests: 60, period_seconds: 60}}
capabilities: [publish, status, delete, assist_pack]
error_map: {422: PLATFORM_CONTENT_REJECTED, 503: PLATFORM_UNAVAILABLE}
