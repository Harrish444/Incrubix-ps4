key: ghost
version: 1.0.0
tier: core
auth: jwt
surfaces:
  - type: publication
    content_types: [text, image, link]
    spec: {title_max_chars: 255, body_max_chars: 100000, links_allowed: true}
rate_limits: {per_connection: {requests: 30, period_seconds: 60}}
capabilities: [publish, status, delete, metrics]
error_map: {422: PLATFORM_CONTENT_REJECTED, 429: PLATFORM_RATE_LIMIT, 401: CONNECTION_AUTH_EXPIRED}
instance_param: base_url
